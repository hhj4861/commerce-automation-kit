name: Shared AI gateway
on:
  push:
    branches: [main, feat/shared-ai-gateway]
    paths: ["services/ai-gateway/**", ".github/workflows/ai-gateway.yml"]
  pull_request:
    paths: ["services/ai-gateway/**", ".github/workflows/ai-gateway.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - name: Configure isolated mock providers
        run: |
          python gateway.py init
          cat >> .env <<'ENV'
          HANMADI_CHAT_MODEL=openai/gpt-4o-mini
          HANMADI_CHAT_API_KEY=ci-not-a-provider-key
          HANMADI_CHAT_API_BASE=http://mock:8000/v1
          REPLAY_CHAT_MODEL=openai/gpt-4o-mini
          REPLAY_CHAT_API_KEY=ci-not-a-provider-key
          REPLAY_CHAT_API_BASE=http://mock:8000/v1
          FESTA_CHAT_MODEL=openai/gpt-4o-mini
          FESTA_CHAT_API_KEY=ci-not-a-provider-key
          FESTA_CHAT_API_BASE=http://mock:8000/v1
          ENV
          python gateway.py render
          python tests/subscriptions_integration.py prepare
          docker compose -f compose.yaml -f compose.test.yaml -f .runtime/subscriptions.compose.json config --quiet
      - name: Start actual gateway and database
        run: docker compose -f compose.yaml -f compose.test.yaml -f .runtime/subscriptions.compose.json up -d --wait --wait-timeout 300
      - run: python tests/integration.py
      - run: python tests/subscriptions_integration.py
      - name: Verify pinned subscription stream recovery
        run: docker compose -f compose.yaml -f .runtime/subscriptions.compose.json run --rm --no-deps -T --entrypoint python codex-alice - /app/subscription-runtime.py < tests/subscription_sdk.py
      - name: Check pinned OAuth interface and noninteractive guard without login
        run: |
          docker compose -f compose.yaml -f .runtime/subscriptions.compose.json run --rm --no-deps -T --entrypoint python codex-alice -c '
          import sys
          sys.path.insert(0, "/app")
          import importlib.util
          spec = importlib.util.spec_from_file_location("runtime", "/app/subscription-runtime.py")
          runtime = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runtime)
          runtime.noninteractive_auth()
          from litellm.llms.chatgpt.authenticator import Authenticator
          try:
              Authenticator()._login_device_code()
          except RuntimeError:
              print("PASS: interactive login is blocked in inference workers")
          else:
              raise AssertionError("Unexpected device flow")
          '
      - name: Verify persistence after restart
        run: |
          docker compose restart gateway
          docker compose -f compose.yaml -f compose.test.yaml -f .runtime/subscriptions.compose.json up -d --wait --wait-timeout 120
          python tests/integration.py
          python tests/subscriptions_integration.py
      - name: Validate HTTPS proxy configuration
        run: docker compose --profile public run --rm --no-deps https caddy validate --config /etc/caddy/Caddyfile
      - name: Cleanup ephemeral CI data
        if: always()
        run: |
          if test -f .runtime/subscriptions.compose.json; then
            docker compose -f compose.yaml -f compose.test.yaml -f .runtime/subscriptions.compose.json down -v
          else
            docker compose -f compose.yaml -f compose.test.yaml down -v
          fi
