# 회사망이 ElevenLabs TLS 를 SSL 검사로 차단할 때의 우회 경로 —
# TTS 만 GitHub 러너에서 생성해 아티팩트로 회수한다(조립은 로컬 ffmpeg).
# workflow_dispatch 전용: 쓰기 권한자만 실행 가능(공개 레포에서도 시크릿 안전).
name: tts-remote
on:
  workflow_dispatch:
    inputs:
      verify_secrets_only:
        description: "Verify Cloudflare credentials without generating media"
        type: boolean
        default: false
      script_b64:
        description: "ShortsScript JSON (base64)"
        required: true
        type: string
      voice_id:
        description: "ElevenLabs voice id"
        required: false
        default: "n2fbxG88jqAoaVPUy3IG"  # Yooni
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Load credentials from Cloudflare
        env:
          CAK_SECRETS_URL: ${{ vars.CAK_SECRETS_URL }}
          CAK_SECRETS_ACTION: ${{ inputs.verify_secrets_only && 'verify' || 'load' }}
        run: node apps/credential-broker/github-client.mjs
      - run: npm install --no-package-lock --no-audit --no-fund
        if: ${{ !inputs.verify_secrets_only }}
      - name: Generate narration
        if: ${{ !inputs.verify_secrets_only }}
        env:
          ELEVENLABS_VOICE_ID: ${{ inputs.voice_id }}
          SCRIPT_B64: ${{ inputs.script_b64 }}
        run: |
          printf '%s' "$SCRIPT_B64" | base64 -d > /tmp/script.json
          npm run --silent cli -w @cak/tts-narration -- script --script /tmp/script.json --outdir "$RUNNER_TEMP/vo-out"
          ls -la "$RUNNER_TEMP/vo-out"
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.verify_secrets_only }}
        with:
          name: narration
          path: ${{ runner.temp }}/vo-out
          if-no-files-found: error
          retention-days: 1
