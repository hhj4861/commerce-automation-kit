name: AI Card News (Telegram)

# Daily AI tech card briefing for the operator's own Telegram chat (apps/shopshorts/card-news).
# - Scheduled runs happen only while repository variable CARD_NEWS_SCHEDULE is 'on'.
# - Until repository variable CARD_NEWS_CUTOVER_DATE (YYYY-MM-DD, KST) is reached, or while it is
#   unset, every run is a shadow run: cards are generated and the bot/chat and the legacy
#   wp-auto-blog ledger are checked read-only. Nothing is sent and no ledger tag is written.
# Cutover and rollback steps: apps/shopshorts/card-news/README.md
on:
  schedule:
    - cron: "47 22 * * *" # 07:47 KST, off the hour to avoid the top-of-hour Actions backlog
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate cards only (no Telegram, ledger or legacy checks)
        type: boolean
        default: true
      force_provider:
        description: Editorial provider for dry-run or shadow verification
        type: choice
        options: [auto, gemini]
        default: auto
  pull_request:
    paths:
      - apps/shopshorts/card-news/**
      - .github/workflows/ai-card-news.yml

permissions: {}

# Only runs that can touch the ledger or the chat share the 'deliver' group, so a manual
# dry run can never displace a pending scheduled delivery.
concurrency:
  group: ai-card-news-${{ github.event_name == 'pull_request' && github.ref || (inputs.dry_run && format('dry-{0}', github.run_id) || 'deliver') }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/shopshorts/card-news
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Install hash-pinned dependencies
        # sgmllib3k ships only an sdist: pin its build backend too and disable build isolation.
        run: |
          python -m pip install --require-hashes -r build-requirements.txt
          python -m pip install --require-hashes --no-build-isolation -r requirements.txt
      - name: Unit and layout tests
        run: python -m unittest -v test_main

  digest:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && vars.CARD_NEWS_SCHEDULE == 'on'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # delivery ledger tags refs/tags/ai-card-* only; no file is committed
    defaults:
      run:
        working-directory: apps/shopshorts/card-news
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Install hash-pinned dependencies
        # sgmllib3k ships only an sdist: pin its build backend too and disable build isolation.
        run: |
          python -m pip install --require-hashes -r build-requirements.txt
          python -m pip install --require-hashes --no-build-isolation -r requirements.txt
      - name: Unit and layout tests
        run: python -m unittest -v test_main
      - name: Generate and deliver
        id: deliver
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.CARD_NEWS_OPENAI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.CARD_NEWS_GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.CARD_NEWS_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CARD_NEWS_TELEGRAM_CHAT_ID }}
          CARD_NEWS_CUTOVER_DATE: ${{ vars.CARD_NEWS_CUTOVER_DATE }}
          CARD_NEWS_LEGACY_REPOSITORY: ${{ vars.CARD_NEWS_LEGACY_REPOSITORY }} # empty = default; 'off' after wp deletion
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE_PROVIDER: ${{ inputs.force_provider || 'auto' }}
        run: python main.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ai-card-news-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/shopshorts/card-news/output/
          retention-days: 14
      - name: Alert operator on live failure
        # Standard library only, so it also covers setup, install and test failures.
        # An artifact upload failure after a successful delivery does not alert.
        if: failure() && steps.deliver.outcome != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CARD_NEWS_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CARD_NEWS_TELEGRAM_CHAT_ID }}
          CARD_NEWS_CUTOVER_DATE: ${{ vars.CARD_NEWS_CUTOVER_DATE }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 alert.py
