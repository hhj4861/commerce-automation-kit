name: Hanmadi Dify connection
on:
  push:
    branches: [main, feat/hanmadi-multilingual-ai]
    paths: ["apps/hanmadi/**", "services/dify/**", "services/ai-gateway/**", ".github/workflows/hanmadi-dify.yml"]
  pull_request:
    paths: ["apps/hanmadi/**", "services/dify/**", "services/ai-gateway/**", ".github/workflows/hanmadi-dify.yml"]
permissions:
  contents: read
jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install PyYAML==6.0.3
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install and verify Hanmadi
        working-directory: apps/hanmadi
        run: |
          npm ci --prefix . --workspaces=false
          npm test
          node node_modules/typescript/bin/tsc --noEmit
          npm run build
      - name: Prepare Dify
        run: |
          python services/dify/dify.py prepare
          python services/dify/dify.py compose config --quiet
      - name: Start shared gateway with a synthetic upstream
        working-directory: services/ai-gateway
        run: |
          python gateway.py init
          cat >> .env <<'ENV'
          HANMADI_CHAT_MODEL=openai/gpt-4o-mini
          HANMADI_CHAT_API_KEY=ci-not-a-provider-key
          HANMADI_CHAT_API_BASE=http://mock:8000/v1
          REPLAY_CHAT_MODEL=openai/gpt-4o-mini
          REPLAY_CHAT_API_KEY=ci-not-a-provider-key
          REPLAY_CHAT_API_BASE=http://mock:8000/v1
          ENV
          python gateway.py render
          docker compose -f compose.yaml -f compose.test.yaml up -d --wait --wait-timeout 300
          python tests/integration.py
      - name: Start Dify and import the tutor app
        env:
          DIFY_DISPOSABLE_CI: '1'
          DIFY_EXPORT_HANMADI_CI: '1'
        run: |
          python services/dify/dify.py compose up -d nginx api_websocket worker worker_beat sandbox ssrf_proxy weaviate
          python services/dify/tests/integration.py
      - name: Next.js API to real Dify and LiteLLM
        working-directory: apps/hanmadi
        env:
          HANMADI_DIFY_CI_FILE: '${{ github.workspace }}/services/dify/.runtime/hanmadi-client.json'
        run: npm run test:dify
      - name: Cleanup Dify containers
        if: always()
        run: python services/dify/dify.py compose down -v
      - name: Cleanup gateway containers
        if: always()
        working-directory: services/ai-gateway
        run: docker compose -f compose.yaml -f compose.test.yaml down -v
