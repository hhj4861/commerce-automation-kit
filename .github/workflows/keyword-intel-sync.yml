name: keyword-intel sync

on:
  schedule:
    # 매시 정각 혼잡을 피해 7분·37분에 실행(간격은 30분).
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      send_telegram:
        description: "Send trend and blog Top 10 reports to Telegram"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: keyword-intel-sync
  cancel-in-progress: false

jobs:
  collect-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/keyword-intel
    env:
      CI: "true"
      DB_PATH: ./data/poc-intel.db
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
      NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
      NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SHOPSHORTS_CLOUD_URL: ${{ secrets.SHOPSHORTS_CLOUD_URL }}
      SHOPSHORTS_TOKEN: ${{ secrets.SHOPSHORTS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        working-directory: .
        # The monorepo lockfile is currently out of sync with workspace manifests.
        # Keep the POC isolated: resolve dependencies on the ephemeral runner without
        # rewriting or committing the repository lockfile.
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Validate required secrets
        shell: bash
        run: |
          missing=()
          for key in NAVER_CLIENT_ID NAVER_CLIENT_SECRET \
            NAVER_AD_CUSTOMER_ID NAVER_AD_API_KEY NAVER_AD_SECRET_KEY \
            SHOPSHORTS_CLOUD_URL SHOPSHORTS_TOKEN; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("$key")
            fi
          done
          if [[ "${{ inputs.send_telegram }}" == "true" ]]; then
            for key in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
              if [[ -z "${!key:-}" ]]; then
                missing+=("$key")
              fi
            done
          fi
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Collect all 182 keywords
        run: npm run -s collect -- --file seeds/g2-seeds.txt

      - name: Build trend D1 feed
        run: npm run -s analyze -- --top 20 --feed-file trend-feed.json

      - name: Build trend Top 10 without sending
        if: ${{ !inputs.send_telegram }}
        run: npm run -s report -- --top 10 --dry-run

      - name: Send trend Top 10 to Telegram
        if: ${{ inputs.send_telegram }}
        run: npm run -s report -- --top 10

      - name: Build blog Top 10
        run: npm run -s analyze -- --blog --top 10 --feed-file blog-feed.json | tee blog-report.txt

      - name: Publish trend and blog feeds to D1
        shell: bash
        run: |
          base="${SHOPSHORTS_CLOUD_URL%/}"
          for channel in trend blog; do
            curl --fail-with-body --retry 3 \
              --request PUT \
              --header "Authorization: Bearer ${SHOPSHORTS_TOKEN}" \
              --header "Content-Type: application/json" \
              --data-binary "@${channel}-feed.json" \
              "${base}/api/keyword-feeds/${channel}"
          done

      - name: Send blog Top 10 to Telegram
        if: ${{ inputs.send_telegram }}
        shell: bash
        run: |
          jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --rawfile text blog-report.txt \
            '{chat_id: $chat_id, text: $text}' > telegram-blog.json
          curl --fail-with-body --retry 3 \
            --header "Content-Type: application/json" \
            --data @telegram-blog.json \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

      - name: Upload ephemeral keyword database
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: keyword-intel-db-${{ github.run_id }}
          path: packages/keyword-intel/data/poc-intel.db
          if-no-files-found: warn
          retention-days: 7
