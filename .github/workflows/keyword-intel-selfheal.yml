name: keyword-intel self-heal check

on:
  workflow_dispatch:
  schedule:
    - cron: '13 1 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Evaluate keyword-intel daily self-heal status
        run: node packages/keyword-intel/scripts/check-status.cjs
