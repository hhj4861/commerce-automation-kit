# 회사망 ElevenLabs 차단 시 BGM 생성 우회 — tts-remote 와 동일 패턴(ai-music 원자).
name: music-remote
on:
  workflow_dispatch:
    inputs:
      verify_secrets_only:
        description: "Verify Cloudflare credentials without generating media"
        type: boolean
        default: false
      brief_b64:
        description: "MusicBrief JSON (base64)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Load credentials from Cloudflare
        env:
          CAK_SECRETS_URL: ${{ vars.CAK_SECRETS_URL }}
          CAK_SECRETS_ACTION: ${{ inputs.verify_secrets_only && 'verify' || 'load' }}
        run: node apps/credential-broker/github-client.mjs
      - run: npm install --no-package-lock --no-audit --no-fund
        if: ${{ !inputs.verify_secrets_only }}
      - name: Generate music
        if: ${{ !inputs.verify_secrets_only }}
        env:
          BRIEF_B64: ${{ inputs.brief_b64 }}
        run: |
          printf '%s' "$BRIEF_B64" | base64 -d > /tmp/brief.json
          npm run --silent cli -w @cak/ai-music -- generate --brief /tmp/brief.json --backend elevenlabs --out "$RUNNER_TEMP/bgm.mp3"
          ls -la "$RUNNER_TEMP/bgm.mp3"
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.verify_secrets_only }}
        with:
          name: bgm
          path: ${{ runner.temp }}/bgm.mp3
          if-no-files-found: error
          retention-days: 1
