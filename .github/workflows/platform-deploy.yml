name: Platform deployment
on:
  push:
    branches: [deploy/shopshorts, deploy/hanmadi, deploy/hanmadi-admin, deploy/firstframe, deploy/litellm]
  workflow_dispatch:
    inputs:
      target:
        description: Select the matching deployment branch in Use workflow from
        required: true
        type: choice
        options: [shopshorts, hanmadi, hanmadi-admin, firstframe, litellm]
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      ready: ${{ steps.plan.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: plan
        run: |
          test "$GITHUB_REF_PROTECTED" = true || { echo '::error::Deployment branch must require pull requests'; exit 1; }
          node ops/deploy/plan.mjs
  deploy:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: platform-production-${{ matrix.name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deployment code
        run: |
          node --test ops/deploy/test.mjs
          python3 -m unittest discover -s ops/deploy -p 'test_*.py'
      - name: Pinned Flutter SDK for the learner web client
        if: matrix.name == 'hanmadi'
        uses: actions/checkout@v4
        with:
          repository: flutter/flutter
          ref: refs/tags/3.47.7
          path: .flutter-sdk
          persist-credentials: false
      - name: Build learner Flutter web before Vercel upload
        if: matrix.name == 'hanmadi'
        env:
          FLUTTER_BIN: ${{ github.workspace }}/.flutter-sdk/bin/flutter
          HANMADI_FLUTTER_BUILD_OUTPUT: ${{ runner.temp }}/hanmadi-flutter-web
          CI: 'true'
          FLUTTER_SUPPRESS_ANALYTICS: 'true'
          DART_SUPPRESS_ANALYTICS: 'true'
        run: |
          test "$(git -C .flutter-sdk rev-parse HEAD)" = "abaf9c523780a608bd46686fd5e53740a07077f8"
          (cd apps/hanmadi-flutter && "$FLUTTER_BIN" --suppress-analytics pub get --enforce-lockfile)
          node apps/hanmadi/scripts/build-flutter-web.mjs --stage
      - name: Install Shopshorts render test dependencies
        if: matrix.name == 'shopshorts'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg ffprobe
      - name: Load only this platform's credentials from Cloudflare
        if: matrix.driver != 'gcp'
        env:
          CAK_SECRETS_URL: ${{ vars.CAK_SECRETS_URL }}
        run: node apps/credential-broker/github-client.mjs
      - name: Check GCP identity configuration
        if: matrix.driver == 'gcp'
        env:
          PROVIDER: ${{ vars.GCP_DEPLOY_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROVIDER" || { echo '::error::Configure GCP_DEPLOY_WIF_PROVIDER'; exit 1; }
          test -n "$SERVICE_ACCOUNT" || { echo '::error::Configure GCP_DEPLOY_SERVICE_ACCOUNT'; exit 1; }
      - uses: google-github-actions/auth@v3
        if: matrix.driver == 'gcp'
        with:
          workload_identity_provider: ${{ vars.GCP_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        if: matrix.driver == 'gcp'
      - name: Deploy the exact triggering revision
        env:
          TARGET: ${{ matrix.name }}
        run: node ops/deploy/deploy.mjs "$TARGET"
