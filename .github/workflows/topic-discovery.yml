name: Shared topic discovery
on:
  pull_request:
    paths: ['apps/credential-broker/**', 'services/topic-discovery/**', 'packages/litellm-client/jev.mjs', 'apps/shopshorts/lib/topic-discovery.js', 'apps/shopshorts/lib/studio-recommendations.js', 'apps/shopshorts/lib/llm-account-errors.js', 'apps/shopshorts/studio-account-*.mjs', 'apps/shopshorts/studio-codex.mjs', 'apps/shopshorts/test/studio-codex.test.mjs', 'apps/shopshorts/test/llm-claude.test.mjs', 'apps/shopshorts/test/topic-discovery.test.mjs', '.github/workflows/topic-discovery.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: discovery
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: discovery_contract
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U discovery -d discovery_contract"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s services/topic-discovery -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          DISCOVERY_TEST_DIR: ${{ runner.temp }}
      - run: pip install --no-deps --require-hashes -r services/topic-discovery/requirements.txt
      - run: python services/topic-discovery/run_postgres_contract.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          DISCOVERY_TEST_DIR: ${{ runner.temp }}
          DISCOVERY_TEST_DATABASE_URL: postgresql://discovery:synthetic-ci-password@127.0.0.1:5432/discovery_contract
      - run: npm install --prefix apps/credential-broker --ignore-scripts --no-save --package-lock=false
      - run: node --test services/topic-discovery/test-*.mjs apps/credential-broker/test/*.test.mjs apps/shopshorts/test/topic-discovery.test.mjs apps/shopshorts/test/studio-codex.test.mjs apps/shopshorts/test/llm-claude.test.mjs
        env:
          DISCOVERY_TEST_DIR: ${{ runner.temp }}
      - run: docker build -f services/topic-discovery/Dockerfile -t cak-discovery:test .
      - run: docker run --rm cak-discovery:test node --check services/topic-discovery/jev-bridge.mjs
      - name: Verify discovery runtime imports in the built image
        run: docker run --rm --workdir /app/services/topic-discovery cak-discovery:test python3 -c 'import server, service, native_review; assert native_review.VERSION == "discovery-v2.6"'
      - name: Verify Python system certificate trust is installed
        run: docker run --rm cak-discovery:test python3 -c 'import ssl; assert ssl.create_default_context().cert_store_stats()["x509_ca"] > 0'
