name: Shared topic discovery
on:
  pull_request:
    paths: ['services/topic-discovery/**', 'packages/litellm-client/jev.mjs', 'apps/shopshorts/lib/topic-discovery.js', 'apps/shopshorts/lib/studio-recommendations.js', 'apps/shopshorts/lib/llm-account-errors.js', 'apps/shopshorts/studio-account-*.mjs', 'apps/shopshorts/test/topic-discovery.test.mjs', '.github/workflows/topic-discovery.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s services/topic-discovery -p test_service.py -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          DISCOVERY_TEST_DIR: ${{ runner.temp }}
      - run: node --test services/topic-discovery/test-client.mjs apps/shopshorts/test/topic-discovery.test.mjs
        env:
          DISCOVERY_TEST_DIR: ${{ runner.temp }}
      - run: docker build -f services/topic-discovery/Dockerfile -t cak-discovery:test .
      - run: docker run --rm cak-discovery:test node --check services/topic-discovery/jev-bridge.mjs
