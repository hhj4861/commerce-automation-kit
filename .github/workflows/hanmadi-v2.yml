name: Hanmadi 2.0 user journeys
on:
  pull_request:
    paths: ['apps/hanmadi/**', 'packages/google-identity/**', '.github/workflows/hanmadi-v2.yml']
  push:
    branches: [main]
    paths: ['apps/hanmadi/**', 'packages/google-identity/**', '.github/workflows/hanmadi-v2.yml']
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/hanmadi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --workspaces=false
      - name: Verify shared Google identity source and vendored package
        run: |
          npm install --workspaces=false --package-lock=false --prefix ../../packages/google-identity
          npm test --workspaces=false --prefix ../../packages/google-identity
          diff ../../packages/google-identity/index.mjs node_modules/@cak/google-identity/index.mjs
          diff ../../packages/google-identity/index.d.ts node_modules/@cak/google-identity/index.d.ts
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:google-login
        env:
          HANMADI_E2E_SCREENSHOTS: ${{ runner.temp }}/hanmadi-google-login
      - run: npm run test:v2
      - run: npm run test:admin-deployment
      - run: npm run test:dialog-vocabulary
        env:
          HANMADI_E2E_ARTIFACTS: ${{ runner.temp }}/hanmadi-vocabulary
      - run: npm run test:music
        env:
          HANMADI_E2E_ARTIFACTS: ${{ runner.temp }}/hanmadi-music
      - run: npm run test:diagnostics
        env:
          HANMADI_E2E_SCREENSHOTS: ${{ runner.temp }}/hanmadi-diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hanmadi-v2-screens
          path: |
            ${{ runner.temp }}/hanmadi-google-login/*.png
            docs/hanmadi-v2-e2e/*.png
            apps/hanmadi/.next/admin-deployment-evidence/*.png
            ${{ runner.temp }}/hanmadi-diagnostics/*.png
            ${{ runner.temp }}/hanmadi-diagnostics/result.json
            ${{ runner.temp }}/hanmadi-vocabulary/*.png
            ${{ runner.temp }}/hanmadi-vocabulary/result.json
            ${{ runner.temp }}/hanmadi-music/*.png
            ${{ runner.temp }}/hanmadi-music/result.json
          retention-days: 7
