name: Hanmadi personal model connections
on:
  pull_request:
    paths: ["apps/hanmadi/**", "services/ai-gateway/**", ".github/workflows/hanmadi-model-connections.yml"]
  push:
    branches: [main]
    paths: ["apps/hanmadi/**", "services/ai-gateway/**", ".github/workflows/hanmadi-model-connections.yml"]
permissions:
  contents: read
jobs:
  connections:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install 'litellm[proxy]==1.102.1'
      - run: python -m unittest discover -s tests -p test_accounts.py -v
        working-directory: services/ai-gateway
      - run: npm ci --workspaces=false
        working-directory: apps/hanmadi
      - run: node --import tsx --test lib/model-connections.test.ts
        working-directory: apps/hanmadi
      - run: npx playwright install --with-deps chromium
        working-directory: apps/hanmadi
      - run: node scripts/model-connections-smoke.mjs
        working-directory: apps/hanmadi
  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned native account runtime
        run: docker build -f services/ai-gateway/Dockerfile.accounts -t cak-native-accounts services/ai-gateway
      - name: Verify official binary and isolated account lifecycle
        run: |
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/services/ai-gateway:/accounts:ro" -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/accounts -e CLAUDE_CONFIG_DIR=/tmp/runtime-check \
            cak-native-accounts sh -c '
              claude --version &&
              python -m unittest discover -s tests -p test_accounts.py -v &&
              python -m unittest discover -s tests -p test_claude_code.py -v
            '
