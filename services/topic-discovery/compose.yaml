services:
  discovery:
    build:
      context: ../..
      dockerfile: services/topic-discovery/Dockerfile
    env_file: .env
    ports: ["127.0.0.1:4195:4195"]
    volumes: ["./data:/discovery-data"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4195/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
