<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopshorts — Content Studio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

  :root {
    --canvas: #f7f7f4;
    --surface: #fff;
    --surface-soft: #f1f2ed;
    --ink: #242622;
    --muted: #73776f;
    --faint: #a4a79f;
    --line: #e5e6df;
    --brand: #ff6b4a;
    --brand-soft: #fff0eb;
    --mint: #277e64;
    --mint-soft: #e7f4ee;
    --yellow: #a26800;
    --yellow-soft: #fff3d7;
    --red: #b54b42;
    --red-soft: #fbeae7;
    --blue: #5378d8;
    --shadow: 0 12px 32px rgba(35, 42, 32, .07);
    --radius: 18px;
  }

  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: "DM Sans", "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 3px solid rgba(255,107,74,.3); outline-offset: 2px; }
  svg { display: block; }

  .app { min-height: 100vh; display: grid; grid-template-columns: 224px minmax(0, 1fr); }
  .sidebar {
    position: sticky; top: 0; height: 100vh;
    padding: 28px 18px 20px; background: #20231f; color: #fff;
    display: flex; flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 31px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
    background: var(--brand); box-shadow: inset 0 -2px 0 rgba(0,0,0,.08);
  }
  .brand-name { font-size: 16px; font-weight: 700; letter-spacing: -.03em; }
  .brand-name span { display: block; color: #8f948c; font-size: 10px; font-weight: 500; letter-spacing: .07em; margin-top: 1px; }
  .nav-label { color: #777d74; font-size: 10px; font-weight: 700; letter-spacing: .12em; padding: 0 12px 9px; }
  nav { display: grid; gap: 5px; }
  .nav-item {
    border: 0; background: transparent; border-radius: 11px; color: #aeb3ab;
    height: 42px; padding: 0 12px; display: flex; align-items: center; gap: 11px;
    text-align: left; cursor: pointer; transition: .16s ease;
  }
  .nav-item:hover { color: #fff; background: #2a2e29; }
  .nav-item.active { color: #fff; background: #343833; }
  .nav-item.active svg { color: #ff8065; }
  .nav-item .count { margin-left: auto; font-size: 11px; color: #23251f; background: #ff8065; border-radius: 99px; padding: 1px 7px; font-weight: 700; }
  .sidebar-foot { margin-top: auto; }
  .system {
    border: 1px solid #353a34; background: #272a26; border-radius: 13px; padding: 12px;
    color: #aeb3ab; font-size: 11px;
  }
  .system strong { display: flex; align-items: center; gap: 7px; color: #e7e9e4; font-size: 12px; margin-bottom: 4px; }
  .online { width: 7px; height: 7px; background: #63c798; border-radius: 50%; box-shadow: 0 0 0 3px rgba(99,199,152,.13); }

  main { min-width: 0; padding: 0 38px 64px; }
  .topbar {
    height: 78px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line); margin-bottom: 31px;
  }
  .breadcrumb { color: var(--muted); font-size: 13px; }
  .breadcrumb strong { color: var(--ink); font-weight: 600; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px;
    border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: #d5e7df; display: grid; place-items: center; color: var(--mint); font-size: 12px; font-weight: 700; }
  .view[hidden] { display: none; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 31px 0 24px; }
  .page-head h1 { margin-top: 5px; }
  .page-head p { color: var(--muted); margin: 8px 0 0; }
  .page-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
  .page-card { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 17px; }
  .page-card.clickable { cursor: pointer; transition: .15s ease; }
  .page-card.clickable:hover { transform: translateY(-1px); border-color: #d0d3ca; box-shadow: var(--shadow); }
  .page-card h3 { margin: 0; font-size: 14px; }
  .page-card p { color: var(--muted); font-size: 11px; line-height: 1.6; margin: 7px 0 0; }
  .metric-large { font-size: 30px; font-weight: 700; letter-spacing: -.05em; margin-top: 13px; }
  .video-library { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
  .video-card-shell { position: relative; min-width: 0; }
  .video-card {
    width: 100%; border: 0; background: transparent; padding: 0; text-align: left; cursor: pointer;
    min-width: 0; border-radius: 18px; display: block;
  }
  .video-delete {
    position: absolute; z-index: 4; right: 10px; top: 10px; width: 31px; height: 31px;
    display: grid; place-items: center; border: 1px solid rgba(255,255,255,.34); border-radius: 10px;
    background: rgba(31,34,29,.68); color: #fff; cursor: pointer; backdrop-filter: blur(7px);
    opacity: 0; transform: translateY(-3px); transition: opacity .15s ease, transform .15s ease, background .15s ease;
  }
  .video-card-shell:hover .video-delete, .video-delete:focus-visible { opacity: 1; transform: translateY(0); }
  .video-delete:hover { background: var(--red); }
  .video-cover {
    position: relative; aspect-ratio: 9 / 14; overflow: hidden; border-radius: 17px;
    background: linear-gradient(145deg, #dbc1bd, #584950); box-shadow: 0 10px 28px rgba(35,42,32,.08);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .video-card:hover .video-cover { transform: translateY(-3px); box-shadow: 0 16px 34px rgba(35,42,32,.13); }
  .video-cover video { width: 100%; height: 100%; object-fit: cover; background: #1d201c; }
  .video-cover::after { content:""; position:absolute; inset:auto 0 0; height:38%; background:linear-gradient(transparent,rgba(15,17,14,.62)); pointer-events:none; }
  .video-cover.empty::before {
    content:""; position:absolute; width:86px; height:86px; border:18px solid rgba(255,255,255,.08);
    border-radius:50%; right:-26px; top:-22px;
  }
  .cover-play {
    position:absolute; z-index:2; left:50%; top:50%; transform:translate(-50%,-50%);
    width:43px; height:43px; display:grid; place-items:center; border-radius:50%;
    background:rgba(255,255,255,.9); color:var(--ink); box-shadow:0 5px 16px rgba(0,0,0,.13);
  }
  .cover-state { position:absolute; z-index:2; left:11px; top:11px; padding:5px 8px; border-radius:99px; background:rgba(24,27,23,.68); color:#fff; font-size:9px; font-weight:700; backdrop-filter:blur(7px); }
  .cover-duration { position:absolute; z-index:2; right:10px; bottom:10px; color:#fff; font-size:9px; font-weight:600; }
  .cover-placeholder { position:absolute; inset:0; display:grid; place-items:center; color:rgba(255,255,255,.72); }
  .video-info { padding:11px 3px 4px; }
  .video-info strong { display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .video-info span { display:block; color:var(--muted); font-size:10px; margin-top:4px; }
  .library-meta { display:flex; align-items:center; justify-content:space-between; gap:15px; margin-bottom:16px; color:var(--muted); font-size:11px; }
  .library-filter { display:flex; gap:6px; }
  .library-filter button { border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:9px; height:31px; padding:0 10px; font-size:10px; cursor:pointer; }
  .library-filter button.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  .archive-picker { display:flex; align-items:center; gap:8px; }
  .archive-picker label { color:var(--faint); font-size:10px; font-weight:700; letter-spacing:.05em; }
  .archive-picker select {
    border:1px solid var(--line); border-radius:9px; min-height:34px; padding:0 32px 0 11px;
    background:#fff; color:var(--ink); font:inherit; font-size:11px; cursor:pointer;
  }
  .viewer {
    position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:24px;
    background:rgba(22,24,21,.7); backdrop-filter:blur(8px);
  }
  .viewer[hidden] { display:none; }
  .viewer-panel {
    width:min(880px,96vw); max-height:92vh; overflow:auto; display:grid; grid-template-columns:minmax(260px,390px) minmax(260px,1fr);
    background:var(--surface); border-radius:22px; box-shadow:0 30px 80px rgba(0,0,0,.28); position:relative;
  }
  .viewer-media { min-height:610px; background:#171916; border-radius:22px 0 0 22px; overflow:hidden; display:grid; place-items:center; }
  .viewer-media video { width:100%; height:100%; max-height:82vh; object-fit:contain; background:#111; }
  .viewer-no-video { color:#8d9189; text-align:center; font-size:12px; line-height:1.6; }
  .viewer-copy { padding:34px 30px; }
  .viewer-copy h2 { font-size:23px; margin:8px 0; }
  .viewer-copy > p { color:var(--muted); font-size:12px; line-height:1.65; }
  .viewer-close { position:absolute; z-index:3; right:15px; top:14px; width:34px; height:34px; border:1px solid var(--line); background:rgba(255,255,255,.92); border-radius:10px; cursor:pointer; font-size:20px; }
  .viewer-beats { margin-top:23px; display:grid; gap:12px; }
  .viewer-beat { display:grid; grid-template-columns:24px 1fr; gap:9px; color:var(--muted); font-size:11px; line-height:1.55; }
  .page-table { border: 1px solid var(--line); border-radius: 17px; overflow: hidden; background: var(--surface); }
  .page-row { display: grid; grid-template-columns: minmax(180px,1fr) 130px 130px 110px; gap: 15px; align-items: center; padding: 14px 17px; border-bottom: 1px solid var(--line); }
  .page-row:last-child { border-bottom: 0; }
  .page-row.header { color: var(--muted); background: var(--surface-soft); font-size: 10px; font-weight: 700; letter-spacing: .05em; }
  .page-row strong { font-size: 12px; }
  .page-row span { color: var(--muted); font-size: 11px; }
  .page-row button { border: 1px solid var(--line); background: #fff; border-radius: 8px; height: 31px; font-size: 10px; cursor: pointer; }
  .empty-page { padding: 55px 25px; text-align: center; color: var(--muted); }
  .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .setting-row:last-child { border-bottom: 0; }
  .setting-row strong { display: block; font-size: 12px; }
  .setting-row small { color: var(--muted); }
  .toggle { width: 39px; height: 23px; border: 0; border-radius: 99px; background: #cfd2ca; padding: 3px; cursor: pointer; }
  .toggle::after { content:""; display:block; width:17px; height:17px; border-radius:50%; background:#fff; transition:.15s; }
  .toggle.on { background: var(--mint); }
  .toggle.on::after { transform: translateX(16px); }

  .hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 23px; }
  .eyebrow { color: var(--brand); font-size: 11px; font-weight: 700; letter-spacing: .1em; margin-bottom: 7px; }
  h1 { margin: 0; font-size: clamp(26px, 3vw, 34px); letter-spacing: -.055em; line-height: 1.25; }
  .hero p { color: var(--muted); margin: 9px 0 0; }
  .new-btn {
    border: 0; border-radius: 12px; background: var(--ink); color: #fff; height: 43px;
    padding: 0 17px; display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer;
    box-shadow: 0 7px 18px rgba(26,29,25,.13);
  }

  .summary { display: grid; grid-template-columns: 1.35fr repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .summary-card {
    min-height: 108px; border: 1px solid var(--line); background: var(--surface);
    border-radius: var(--radius); padding: 18px 19px; position: relative; overflow: hidden;
    cursor: pointer; transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .summary-card:hover { transform: translateY(-2px); border-color: #d3d5cd; box-shadow: var(--shadow); }
  .summary-card.selected { box-shadow: 0 0 0 2px var(--brand-soft); border-color: #f0a995; }
  .summary-card.featured { background: #26362f; color: #fff; border-color: #26362f; }
  .summary-card.featured::after {
    content: ""; position: absolute; width: 120px; height: 120px; border: 24px solid rgba(255,255,255,.045);
    border-radius: 50%; right: -42px; bottom: -60px;
  }
  .summary-label { color: var(--muted); font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .featured .summary-label { color: #a8b8b1; }
  .summary-value { font-size: 27px; font-weight: 700; letter-spacing: -.05em; margin-top: 10px; line-height: 1; }
  .summary-sub { font-size: 11px; color: var(--muted); margin-top: 7px; }
  .featured .summary-sub { color: #a8b8b1; }
  .summary-card .spark { position: absolute; right: 16px; bottom: 18px; color: #78b19c; }

  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 13px; }
  h2 { margin: 0; font-size: 17px; letter-spacing: -.035em; }
  .section-note { color: var(--muted); font-size: 12px; }
  .topic-strip { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 11px; margin-bottom: 31px; }
  .topic {
    border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,.72);
    padding: 14px 15px; display: flex; align-items: center; gap: 12px;
    cursor: pointer; transition: transform .15s ease, border-color .15s ease;
  }
  .topic:hover { transform: translateY(-1px); border-color: #d2d4cc; }
  .topic-rank { width: 30px; height: 30px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 700; }
  .topic-info { min-width: 0; }
  .topic-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topic-score { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .topic button {
    margin-left: auto; flex: 0 0 auto; border: 1px solid var(--line); background: #fff;
    width: 31px; height: 31px; border-radius: 9px; display: grid; place-items: center; cursor: pointer;
  }
  .topic button:hover { border-color: var(--brand); color: var(--brand); }

  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
  .queue-shell, .detail {
    border: 1px solid var(--line); border-radius: 20px; background: rgba(255,255,255,.78);
  }
  .queue-shell { padding: 18px; min-width: 0; }
  .queue-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .queue-top h2 span { margin-left: 5px; color: var(--faint); font-weight: 500; }
  .view-controls { display: flex; gap: 7px; }
  .mini-btn {
    border: 1px solid var(--line); background: #fff; color: var(--muted); height: 34px;
    padding: 0 11px; border-radius: 10px; display: flex; align-items: center; gap: 6px; cursor: pointer;
  }
  .pipeline {
    display: flex; overflow-x: auto; gap: 3px; padding: 19px 0 15px; scrollbar-width: none;
  }
  .pipeline::-webkit-scrollbar { display: none; }
  .stage {
    min-width: max-content; border: 0; background: transparent; border-radius: 9px; padding: 8px 10px;
    color: var(--muted); cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 7px;
  }
  .stage:hover { background: var(--surface-soft); }
  .stage.active { background: var(--ink); color: #fff; }
  .stage-count { min-width: 19px; height: 19px; padding: 0 5px; border-radius: 6px; display: grid; place-items: center; background: #eceee8; color: var(--muted); font-size: 10px; }
  .stage.active .stage-count { background: #fff; color: var(--ink); }
  .stage.attention:not(.active) { color: var(--brand); }

  .job-list { display: grid; gap: 8px; }
  .job {
    border: 1px solid transparent; background: #fff; border-radius: 14px; padding: 14px;
    display: grid; grid-template-columns: 42px minmax(0,1fr) auto; gap: 12px; align-items: center;
    cursor: pointer; transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .job:hover { transform: translateY(-1px); border-color: #dcded6; box-shadow: 0 8px 22px rgba(35,42,32,.06); }
  .job.selected { border-color: #f4a28e; box-shadow: 0 0 0 2px var(--brand-soft); }
  .thumb { width: 42px; height: 51px; border-radius: 10px; display: grid; place-items: center; color: rgba(255,255,255,.9); overflow: hidden; }
  .thumb.beauty { background: linear-gradient(145deg, #df9f9a, #774f61); }
  .thumb.home { background: linear-gradient(145deg, #93b6a4, #40594c); }
  .thumb.food { background: linear-gradient(145deg, #e2aa62, #82523e); }
  .job-title { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job-meta { margin-top: 5px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
  .dot { width: 3px; height: 3px; border-radius: 50%; background: #c3c5bf; }
  .flag { padding: 2px 6px; border-radius: 5px; background: var(--yellow-soft); color: var(--yellow); font-weight: 600; }
  .job-action {
    border: 0; background: var(--brand); color: #fff; padding: 0 12px; height: 34px;
    border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .job-action.secondary { background: var(--mint-soft); color: var(--mint); }
  .job-action.quiet { background: var(--surface-soft); color: var(--muted); }
  .job-actions { display:flex; align-items:center; gap:6px; }
  .job-delete {
    width:34px; height:34px; display:grid; place-items:center; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--faint); cursor:pointer;
  }
  .job-delete:hover, .job-delete:focus-visible { color:var(--red); border-color:#e8b5ac; background:#fff5f2; }

  .detail { position: sticky; top: 18px; overflow: hidden; }
  .detail-empty { padding: 50px 25px; color: var(--muted); text-align: center; }
  .detail-head { padding: 20px 20px 16px; border-bottom: 1px solid var(--line); }
  .detail-kicker { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 11px; margin-bottom: 10px; }
  .status-pill { border-radius: 99px; padding: 4px 8px; background: var(--brand-soft); color: var(--brand); font-weight: 700; }
  .detail h3 { font-size: 18px; margin: 0; letter-spacing: -.04em; }
  .detail-desc { color: var(--muted); font-size: 11px; margin-top: 6px; line-height: 1.55; }
  .video-preview {
    margin: 16px 20px 0; height: 145px; border-radius: 15px; overflow: hidden; position: relative;
    background: radial-gradient(circle at 68% 30%, #e7b8b3, transparent 27%), linear-gradient(145deg, #a87279, #332f3c);
  }
  .video-preview::after { content: ""; position: absolute; inset: auto 0 0; height: 55%; background: linear-gradient(transparent, rgba(18,20,18,.52)); }
  .play {
    position: absolute; z-index: 2; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.38);
    background: rgba(255,255,255,.9); display: grid; place-items: center; color: var(--ink);
  }
  .duration { position: absolute; z-index: 2; bottom: 10px; right: 10px; color: #fff; font-size: 10px; background: rgba(0,0,0,.4); border-radius: 5px; padding: 3px 6px; }
  .detail-body { padding: 17px 20px 20px; }
  .detail-section + .detail-section { margin-top: 18px; }
  .detail-label { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .08em; margin-bottom: 9px; }
  .steps { display: grid; gap: 9px; }
  .beat { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; font-size: 11px; align-items: start; }
  .beat-num { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-soft); color: var(--muted); font-size: 9px; }
  .beat p { margin: 1px 0 0; line-height: 1.5; }
  .beat time { color: var(--faint); font-size: 10px; margin-top: 3px; }
  .checkline { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--mint); background: var(--mint-soft); border-radius: 9px; padding: 9px 10px; }
  .detail-cta { width: 100%; height: 42px; border: 0; background: var(--brand); color: #fff; border-radius: 11px; font-weight: 700; cursor: pointer; margin-top: 16px; }
  .detail-cta:disabled { background: var(--surface-soft); color: var(--faint); cursor: default; }
  .detail-links { display: flex; justify-content: center; gap: 16px; margin-top: 11px; }
  .detail-links button { border: 0; background: none; color: var(--muted); font-size: 10px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .detail-tools { display: flex; flex-wrap: wrap; gap: 7px; }
  .tool-btn {
    border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 9px;
    min-height: 33px; padding: 0 10px; font-size: 10px; font-weight: 600; cursor: pointer;
  }
  .tool-btn:hover { border-color: #bbbfb5; color: var(--ink); }
  .tool-btn.warm { border-color: #f2c0b4; color: var(--brand); background: var(--brand-soft); }
  .tool-btn.danger { color: var(--red); }
  .affiliate-partners { display:grid; gap:14px; }
  .affiliate-partner {
    border:1px solid var(--line); border-radius:17px; background:var(--surface); overflow:hidden;
  }
  .affiliate-partner-head {
    display:flex; align-items:center; justify-content:space-between; gap:15px;

      <div class="summary-label">자동 제작 중</div><div class="summary-value">${generating}</div>
      <div class="summary-sub">클립 · 내레이션</div>
    </article>
    <article class="summary-card ${state.filter === 'published' ? 'selected' : ''}" data-summary-filter="published">
      <div class="summary-label">발행 완료</div><div class="summary-value">${published}</div>
      <div class="summary-sub">누적 콘텐츠</div>
      <div class="spark"><svg width="58" height="24" viewBox="0 0 58 24" fill="none"><path d="M1 20c8-1 8-8 16-8s8 5 16 1S42 4 57 2" stroke="currentColor" stroke-width="2"/><path d="M1 20c8-1 8-8 16-8s8 5 16 1S42 4 57 2v22H1Z" fill="currentColor" opacity=".08"/></svg></div>
    </article>`;
  document.querySelectorAll('[data-summary-filter]').forEach(card => card.onclick = () => {
    setQueueFilter(card.dataset.summaryFilter, false);
  });
}

function renderTopics() {
  const defaults = [{topic:'PDRN 앰플',opportunity:92},{topic:'저당 간식',opportunity:87},{topic:'여름 침구',opportunity:81}];
  const items = state.hot.length ? state.hot.slice(0,3) : defaults;
  const pending = state.requests.filter(r => r.status === 'pending');
  document.getElementById('topics').innerHTML = pending.map(r => `
    <article class="topic" style="background:var(--yellow-soft);border-color:#edd9a7">
      <div class="topic-rank" style="background:#fff7e7;color:var(--yellow)">···</div>
      <div class="topic-info"><div class="topic-name">${r.topic}</div><div class="topic-score">초안 작성 대기 중</div></div>
      <span class="status-pill" style="margin-left:auto">요청됨</span>
    </article>`).join('') + items.map((it,i) => `
    <article class="topic" data-topic-card="${it.topic}">
      <div class="topic-rank">${i+1}</div>
      <div class="topic-info"><div class="topic-name">${it.topic}</div><div class="topic-score">기회 점수 ${it.opportunity ?? '-'}</div></div>
      <button aria-label="${it.topic} 초안 만들기" data-topic="${it.topic}" data-score="${it.opportunity ?? ''}">${svg('plus',15)}</button>
    </article>`).join('');
  document.querySelectorAll('[data-topic-card]').forEach(card => card.onclick = () => {
    showToast(`“${card.dataset.topicCard}” · 오른쪽 + 버튼을 누르면 초안을 만들 수 있어요.`);
  });
  document.querySelectorAll('[data-topic]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    try {
      await api('/api/draft-requests', {
        method:'POST', headers:{'content-type':'application/json'},
        body:JSON.stringify({topic:b.dataset.topic, opportunity:Number(b.dataset.score) || undefined, contentType:'shorts'})
      });
      showToast(`“${b.dataset.topic}” 초안을 요청했어요. 기획 대기에서 대본을 작성 중입니다.`);
      await loadHot();
    } catch (e) { showToast('초안 요청 실패: ' + e.message); }
  });
}

function renderPipeline() {
  const pending = state.requests.filter(r => r.status === 'pending').length;
  document.getElementById('pipeline').innerHTML = STAGES.map(s => {
    const count = s.key === 'all'
      ? state.jobs.length + pending
      : state.jobs.filter(j => j.status === s.key).length + (s.key === 'draft' ? pending : 0);
    return `<button class="stage ${state.filter === s.key ? 'active' : ''} ${s.attention ? 'attention' : ''}" data-stage="${s.key}">${s.label}<span class="stage-count">${count}</span></button>`;
  }).join('');
  document.querySelectorAll('[data-stage]').forEach(b => b.onclick = () => setQueueFilter(b.dataset.stage));
}

function renderJobs() {
  const order = ['review','draft','generated','assembled','script-approved','rejected','published'];
  const pendingJobs = state.requests
    .filter(r => r.status === 'pending')
    .map((r, index) => ({
      _request:true,
      _requestSlug:r.slug,
      status:'draft',
      brief:{id:`request:${r.slug || index}`, productName:r.topic, category:'', affiliateUrl:''},
      script:{title:'초안 작성 중'},
      updatedAt:r.requestedAt || r.requested_at
    }));
  let jobs = [...state.jobs, ...pendingJobs];
  if (state.sort === 'updated') {
    jobs.sort((a,b) => new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0));
  } else {
    jobs.sort((a,b) => order.indexOf(a.status)-order.indexOf(b.status));
  }
  if (state.filter === 'needs') jobs = jobs.filter(j => ['draft','generated','assembled','review','rejected'].includes(j.status));
  else if (state.filter === 'generating') jobs = jobs.filter(j => j.status === 'script-approved' || j.finalize?.state === 'running');
  else if (state.filter === 'missing-link') jobs = jobs.filter(j => !j._request && isPlaceholder(j.brief?.affiliateUrl));
  else if (state.filter !== 'all') jobs = jobs.filter(j => j.status === state.filter);
  if (state.search) {
    const q = state.search.toLocaleLowerCase('ko');
    jobs = jobs.filter(j => `${j.brief?.productName || ''} ${j.brief?.keyword || ''} ${j.script?.title || ''}`.toLocaleLowerCase('ko').includes(q));
  }
  document.getElementById('queueCount').textContent = jobs.length;
  const box = document.getElementById('jobs');
  if (!jobs.length) { box.innerHTML = '<div class="detail-empty">이 단계에는 아직 콘텐츠가 없어요.</div>'; return; }
  box.innerHTML = jobs.map(j => {
    const st = STATUS[j.status] || {label:j.status,action:'확인',cls:'quiet'};
    const waiting = j._request;
    const warning = !waiting && isPlaceholder(j.brief?.affiliateUrl) ? '<span class="flag">링크 필요</span>' : '';
    return `<article class="job ${state.selected === j.brief.id ? 'selected' : ''}" data-job="${j.brief.id}">
      <div class="thumb ${categoryClass(j)}">${svg('image',18)}</div>
      <div><div class="job-title">${j.brief.productName}</div>
      <div class="job-meta"><span>${st.label}</span><span class="dot"></span><span>${waiting ? '초안 작성 중' : (HOOK[j.script?.hookType] || '쇼츠')}</span><span class="dot"></span><span>${fmtTime(j.updatedAt)}</span>${warning}</div></div>
      <div class="job-actions">
        <button class="job-action ${waiting ? 'quiet' : st.cls}" ${waiting ? 'data-request-waiting' : `data-action="${j.brief.id}"`}>${waiting ? '작성 중' : st.action}</button>
        <button class="job-delete" aria-label="${escapeHtml(j.brief.productName)} 삭제" ${waiting
          ? `data-delete-request="${escapeHtml(j._requestSlug || '')}"`
          : `data-delete-job="${escapeHtml(j.brief.id)}"`}>${svg('trash',15)}</button>
      </div>
    </article>`;
  }).join('');
  document.querySelectorAll('[data-job]').forEach(row => row.onclick = () => {
    if (row.dataset.job.startsWith('request:')) {
      showToast('대본을 자동으로 작성 중입니다. 완료되면 기획 승인 버튼이 활성화돼요.');
      return;
    }
    state.selected = row.dataset.job; renderJobs(); renderDetail(true);
  });
  document.querySelectorAll('[data-request-waiting]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    showToast('대본을 자동으로 작성 중입니다. 완료되면 기획 승인 버튼이 활성화돼요.');
  });
  document.querySelectorAll('[data-action]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const job = state.jobs.find(j => j.brief.id === b.dataset.action);
    if (job) runPrimary(job);
  });
  document.querySelectorAll('[data-delete-job]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const job = state.jobs.find(j => j.brief.id === b.dataset.deleteJob);
    if (job) deleteJob(job);
  });
  document.querySelectorAll('[data-delete-request]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const request = state.requests.find(r => r.slug === b.dataset.deleteRequest);
    if (request) deleteDraftRequest(request);
  });
}

function setQueueFilter(filter, scrollToQueue=true) {
  state.filter = filter;
  state.search = '';
  renderSummary();
  renderPipeline();
  renderJobs();
  if (scrollToQueue) {
    document.querySelector('[data-section="content"]')?.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

function previousStage(status) {
  return {'script-approved':'draft',generated:'script-approved',assembled:'generated',review:'assembled',published:'review'}[status];
}
async function transition(job, to, extra={}) {
  const body = {to, ...extra};
  if (to === 'rejected') {
    const note = prompt('수정이 필요한 이유를 적어주세요.');
    if (note === null) return;
    body.note = note;
  }
  try {
    await api(`/api/jobs/${job.brief.id}/transition`, {
      method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)
    });
    showToast('상태를 변경했어요.');
    await load(true);
  } catch (e) { showToast('처리 실패: ' + e.message); }
}
async function deleteJob(job) {
  const name = job.brief?.productName || job.brief?.id || '콘텐츠';
  if (!confirm(`“${name}” 콘텐츠를 삭제할까요?\n\n작업 기록과 클라우드에 업로드된 미리보기·최종 영상이 함께 삭제됩니다. 이 작업은 되돌릴 수 없습니다.`)) return;
  try {
    await api(`/api/jobs/${job.brief.id}`, {method:'DELETE'});
    closeViewer();
    state.selected = null;
    state.detailKey = null;
    showToast(`“${name}” 콘텐츠를 삭제했어요.`);
    await load();
  } catch (e) {
    showToast('콘텐츠 삭제 실패: ' + e.message);
  }
}
async function deleteDraftRequest(request) {
  if (!confirm(`“${request.topic}” 초안 요청을 취소할까요?`)) return;
  try {
    await api(`/api/draft-requests/${encodeURIComponent(request.slug)}`, {method:'DELETE'});
    showToast('초안 요청을 취소했어요.');
    await loadHot();
  } catch (e) {
    showToast('요청 취소 실패: ' + e.message);
  }
}
async function finalize(job) {
  if (!confirm('Yooni 보이스로 내레이션을 만들고 자막과 고지를 입힐까요? ElevenLabs 비용이 발생합니다.')) return;
  try {
    const endpoint = state.isCloud ? 'request-finalize' : 'finalize';
    await api(`/api/jobs/${job.brief.id}/${endpoint}`, {method:'POST'});
    showToast(state.isCloud ? '로컬 워커에 후반 작업을 요청했어요.' : '후반 작업을 시작했어요. 완료되면 자동으로 갱신됩니다.');
    await load(true);
  } catch (e) { showToast('후반 작업 시작 실패: ' + e.message); }
}
function confirmPublish(job) {
  if (isPlaceholder(job.brief.affiliateUrl)) {
    showToast('발행 전에 실제 제휴 링크를 저장해 주세요.');
    state.selected = job.brief.id; renderDetail(); return;
  }
  if (!confirm('발행 검수를 완료할까요? 확인하면 로컬 워커가 유튜브·인스타그램에 실제 업로드합니다.')) return;
  transition(job, 'published', {});
}
function runPrimary(job) {
  state.selected = job.brief.id;
  if (job.status === 'draft') return transition(job, 'script-approved');
  if (job.status === 'generated') return finalize(job);
  if (job.status === 'assembled') return transition(job, 'review');
  if (job.status === 'review') return confirmPublish(job);
  if (job.status === 'rejected') return transition(job, 'draft');
  renderJobs(); renderDetail();
}

function renderDetail(force=false) {
  const j = state.jobs.find(j => j.brief.id === state.selected);
  if (!j) return;
  const detailKey = `${j.brief.id}:${j.updatedAt || ''}`;
  // 자동 갱신 중 video 요소를 다시 만들면 재생 위치가 초기화되므로 데이터가 바뀔 때만 갱신한다.
  if (!force && state.detailKey === detailKey) return;
  state.detailKey = detailKey;
  const st = STATUS[j.status] || {label:j.status,action:'확인'};
  const beats = (j.script?.beats || []).slice(0,3);
  const totalSec = beats.reduce((n,b)=>n+(b.durationSec||0),0);
  const showFinal = j.outputVideo && ['assembled','review','published'].includes(j.status);
  const showPreview = j.previewVideo && j.status === 'generated';
  const hasAction = ['draft','generated','assembled','review','rejected'].includes(j.status) && !['requested','running'].includes(j.finalize?.state);
  const findings = j.lintReport?.findings || [];
  const affiliate = j.brief.affiliateUrl || '';
  document.getElementById('detail').innerHTML = `
    <div class="detail-head">
      <div class="detail-kicker"><span>콘텐츠 상세</span><span class="status-pill">${st.label}</span></div>
      <h3>${j.brief.productName}</h3>
      <div class="detail-desc">${j.script?.title || '쇼핑 쇼츠 콘텐츠'} · ${HOOK[j.script?.hookType] || '쇼츠'}</div>
    </div>
    <div class="detail-inner">
      <div class="video-preview">
        ${showFinal || showPreview
          ? `<video controls preload="metadata" src="/api/jobs/${j.brief.id}/video?which=${showFinal ? 'final' : 'preview'}"></video>`
          : `<button class="play" aria-label="미리보기 없음" disabled>${svg('play',18)}</button>`}
        <span class="duration">${totalSec}초</span>
      </div>
      <div class="detail-body">
        <div class="detail-section">
          <div class="detail-label">SCRIPT FLOW</div>
          <div class="steps">${beats.map((b,i) => `<div class="beat"><div class="beat-num">0${i+1}</div><p>${b.narration}</p><time>${b.durationSec || '-'}s</time></div>`).join('')}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">QUALITY CHECK</div>
          <div class="checkline">${svg('check',15)} ${j.lintReport?.ok === false ? `확인할 표현이 ${findings.length}건 있어요` : '필수 고지와 표현 검사를 통과했어요'}</div>
          ${findings.length ? `<ul class="finding-list">${findings.map(f => `<li>[${f.severity}] ${f.rule} — ${f.matched}</li>`).join('')}</ul>` : ''}
          ${j.finalize?.state === 'requested' ? '<div class="finalize-note">로컬 워커가 작업을 가져가길 기다리고 있어요…</div>' : ''}
          ${j.finalize?.state === 'running' ? '<div class="finalize-note">내레이션과 자막을 조립하고 있어요…</div>' : ''}
          ${j.finalize?.state === 'error' ? `<div class="finalize-note">조립 실패: ${j.finalize.error}</div>` : ''}
          ${j.upload?.state === 'requested' ? '<div class="finalize-note">발행 확정 — 로컬 워커가 업로드를 가져가길 기다리고 있어요…</div>' : ''}
          ${['running','uploaded'].includes(j.upload?.state) ? '<div class="finalize-note">유튜브·인스타그램에 업로드하고 있어요…</div>' : ''}
          ${j.upload?.state === 'done' ? `<div class="finalize-note">업로드 완료 ✓ ${(j.upload.results||[]).filter(r=>r.url).map(r=>`<a href="${r.url}" target="_blank" rel="noopener">${r.platform}</a>`).join(' · ')}</div>` : ''}
          ${j.upload?.state === 'failed' ? `<div class="finalize-note">업로드 실패: ${j.upload.error || ''}</div>` : ''}
        </div>
        <div class="detail-section">
          <div class="detail-label">AFFILIATE LINK</div>
          <div class="affiliate-box">
            <div class="affiliate-url ${isPlaceholder(affiliate) ? 'missing' : ''}">${affiliate ? (isPlaceholder(affiliate) ? '실제 링크로 교체가 필요해요 · ' : '') + affiliate : '아직 제휴 링크가 없어요.'}</div>
            <div class="affiliate-input-row">
              <input data-affiliate-input type="url" inputmode="url" placeholder="발급한 제휴 링크를 여기에 붙여넣으세요" value="${isPlaceholder(affiliate) ? '' : affiliate}">
              <button class="tool-btn warm" data-save-link>저장</button>
            </div>
            <div class="detail-tools">
              <button class="tool-btn" data-tool="coupang">쿠팡 파트너스</button>
              <button class="tool-btn" data-tool="naver">브랜드커넥트</button>
              <button class="tool-btn" data-tool="deeplink">딥링크 변환</button>
            </div>
            <div class="comment-head"><span>댓글 반영 미리보기</span><button class="tool-btn" data-copy-comment ${affiliateComment(j) ? '' : 'disabled'}>댓글 복사</button></div>
            <textarea class="affiliate-comment" readonly placeholder="링크를 저장하면 고지 문구가 포함된 댓글이 자동 생성됩니다.">${affiliateComment(j)}</textarea>
          </div>
        </div>
        <div class="detail-section">
          <div class="detail-label">TOOLS</div>
          <div class="detail-tools">
            <button class="tool-btn" data-tool="lint">lint 재실행</button>
            <button class="tool-btn" data-tool="estimate">생성 견적</button>
            ${previousStage(j.status) ? '<button class="tool-btn" data-tool="previous">이전 단계</button>' : ''}
            ${j.status === 'published' && j.upload?.state === 'failed' ? '<button class="tool-btn warm" data-tool="retry-upload">업로드 재시도</button>' : ''}
            ${j.status !== 'published' ? '<button class="tool-btn danger" data-tool="reject">수정 요청</button>' : ''}
            <button class="tool-btn danger" data-tool="delete">콘텐츠 삭제</button>
          </div>
        </div>
        <button class="detail-cta" data-primary ${hasAction ? '' : 'disabled'}>${['requested','running'].includes(j.finalize?.state) ? '후반 작업 진행 중' : st.action}</button>
      </div>
    </div>`;
  document.querySelector('[data-primary]')?.addEventListener('click', () => hasAction && runPrimary(j));
  document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => runTool(b.dataset.tool, j));
  document.querySelector('[data-save-link]')?.addEventListener('click', () => {
    const url = document.querySelector('[data-affiliate-input]')?.value.trim();
    if (!url) return showToast('발급한 제휴 링크를 입력해 주세요.');
    saveAffiliateLink(j, url);
  });
  document.querySelector('[data-affiliate-input]')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.querySelector('[data-save-link]')?.click();
  });
  document.querySelector('[data-copy-comment]')?.addEventListener('click', async () => {
    const text = affiliateComment(j);
    if (!text) return;
    try { await navigator.clipboard.writeText(text); showToast('댓글 문구를 복사했어요.'); }
    catch { showToast('댓글을 선택해서 복사해 주세요.'); }
  });
}

async function saveAffiliateLink(j, url) {
  const platform = /coupang|coupa\.ng/.test(url) ? 'coupang' : 'naverConnect';
  try {
    const r = await api(`/api/jobs/${j.brief.id}/set-link`, {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({platform,url})});
    showToast('링크를 저장하고 댓글 문구에 반영했어요' + (r.lint ? ` · lint ${r.lint.ok ? '통과' : '위반'}` : ''));
    await load(true);
  } catch (e) { showToast('링크 저장 실패: ' + e.message); }
}

async function runTool(tool, j) {
  if (tool === 'delete') {
    await deleteJob(j);
    return;
  }
  if (tool === 'set-link') {
    const url = prompt('발급한 제휴 링크를 붙여넣어 주세요.');
    if (!url) return;
    await saveAffiliateLink(j, url.trim());
  }
  if (tool === 'coupang' || tool === 'naver') {
    navigator.clipboard?.writeText(j.brief.productName).catch(()=>{});
    window.open(tool === 'coupang' ? 'https://partners.coupang.com/' : 'https://brandconnect.naver.com/', '_blank');
    showToast('상품명을 복사했어요. 링크 발급 후 붙여넣어 주세요.');
  }
  if (tool === 'deeplink') {
    const productUrl = prompt('쿠팡 상품 URL을 입력해 주세요. 파트너스 API 키가 필요합니다.');
    if (!productUrl) return;
    try {
      const r = await api(`/api/jobs/${j.brief.id}/issue-link`, {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({productUrl:productUrl.trim()})});
      showToast('딥링크를 발급하고 댓글 문구에 반영했어요.'); await load(true);
    } catch (e) { showToast('딥링크 발급 실패: ' + e.message); }
  }
  if (tool === 'retry-upload') {
    try {
      await api(`/api/jobs/${j.brief.id}/request-upload`, {method:'POST'});
      showToast('업로드를 다시 요청했어요.'); await load(true);
    } catch (e) { showToast('재요청 실패: ' + e.message); }
  }
  if (tool === 'lint') {
    try {
      if (state.isCloud) {
        await api(`/api/jobs/${j.brief.id}/request-lint`, {method:'POST'});
        showToast('로컬 워커에 lint 재검증을 요청했어요.');
      } else {
        const r = await api(`/api/jobs/${j.brief.id}/lint`, {method:'POST'});
        showToast(`lint ${r.ok ? '통과' : `위반 ${r.findings.length}건`}`);
      }
      await load(true);
    } catch (e) { showToast('lint 실패: ' + e.message); }
  }
  if (tool === 'estimate') {
    if (state.isCloud) { showToast('생성 견적은 로컬 운영 화면에서 확인할 수 있어요.'); return; }
    try {
      const r = await api(`/api/jobs/${j.brief.id}/estimate?model=kling3_0-pro`, {method:'POST'});
      showToast(`예상 비용 · 클립 ${r.clipsTotal}cr + TTS ${r.ttsCredits}cr = ${r.grandTotal}cr`);

  }

async function load(keepSelection=false) {

          ${which ? `<video muted playsinline preload="metadata" src="/api/jobs/${escapeHtml(j.brief.id)}/video?which=${which}"></video><span class="cover-play">${svg('play',17)}</span>`
            : `<div class="cover-placeholder">${svg('image',27)}</div>`}
          <span class="cover-state">${escapeHtml(status)}</span><span class="cover-duration">${videoDuration(j)}</span>
        </div>
        <div class="video-info"><strong>${escapeHtml(j.brief.productName)}</strong><span>${escapeHtml(HOOK[j.script?.hookType] || '쇼츠')} · ${fmtTime(j.updatedAt)}</span></div>
      </button>
      <button class="video-delete" data-delete-library-job="${escapeHtml(j.brief.id)}" aria-label="${escapeHtml(j.brief.productName)} 삭제">${svg('trash',15)}</button>
    </div>`;
  }).join('');
}
function bindVideoCards() {
  document.querySelectorAll('[data-watch-job]').forEach(card => card.onclick = () => openViewer(card.dataset.watchJob));
  document.querySelectorAll('[data-delete-library-job]').forEach(button => button.onclick = () => {
    const job = state.jobs.find(item => item.brief.id === button.dataset.deleteLibraryJob);
    if (job) deleteJob(job);
  });
}
function openViewer(id) {
  const j = state.jobs.find(j => j.brief.id === id);
  if (!j) return;
  const which = videoWhich(j);
  const viewer = document.getElementById('viewer');
  viewer.innerHTML = `<div class="viewer-panel" role="dialog" aria-modal="true" aria-label="${j.brief.productName}">
    <button class="viewer-close" aria-label="닫기">×</button>
    <div class="viewer-media">${which
      ? `<video controls autoplay playsinline src="/api/jobs/${j.brief.id}/video?which=${which}"></video>`
      : `<div class="viewer-no-video">${svg('image',30)}<br><br>아직 재생할 영상이 없어요.<br>${STATUS[j.status]?.label || j.status} 단계입니다.</div>`}</div>
    <div class="viewer-copy"><div class="eyebrow">${STATUS[j.status]?.label || j.status}</div>
      <h2>${j.brief.productName}</h2><p>${j.script?.title || '쇼핑 쇼츠 콘텐츠'}</p>
      <div class="viewer-beats">${(j.script?.beats || []).map((b,i) => `<div class="viewer-beat"><span class="beat-num">0${i+1}</span><span>${b.narration}</span></div>`).join('')}</div>
      <button class="detail-cta" data-view-detail="${j.brief.id}">작업 상세로 이동</button>
    </div></div>`;
  viewer.hidden = false;
  viewer.querySelector('.viewer-close').onclick = closeViewer;
  viewer.onclick = e => { if (e.target === viewer) closeViewer(); };
  viewer.querySelector('[data-view-detail]').onclick = () => {
    closeViewer(); state.selected = j.brief.id; navigate('dashboard'); renderJobs(); renderDetail(true);
    document.querySelector('[data-section="content"]')?.scrollIntoView({behavior:'smooth',block:'start'});
  };
}
function closeViewer() {
  const viewer = document.getElementById('viewer');
  viewer.querySelector('video')?.pause();
  viewer.hidden = true; viewer.innerHTML = '';
}
document.querySelectorAll('[data-nav]').forEach(button => button.onclick = () => navigate(button.dataset.nav));
window.addEventListener('popstate', () => navigate(currentRoute(), false));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeViewer(); });
document.querySelector('[data-new]')?.addEventListener('click', () => {
  navigate('trends');
});
document.querySelector('[data-control="filter"]')?.addEventListener('click', () => {
  const filters = ['all','needs','missing-link'];
  const labels = {all:'전체 콘텐츠',needs:'확인할 작업', 'missing-link':'링크가 필요한 콘텐츠'};
  const next = filters[(filters.indexOf(state.filter) + 1) % filters.length];
  setQueueFilter(next);
  showToast(`필터: ${labels[next]}`);
});
document.querySelector('[data-control="sort"]')?.addEventListener('click', () => {
  state.sort = state.sort === 'priority' ? 'updated' : 'priority';
  document.getElementById('sortLabel').textContent = state.sort === 'priority' ? '우선순위순' : '업데이트순';
  renderJobs();
});
document.querySelector('[data-top-action="search"]')?.addEventListener('click', () => {
  const query = prompt('찾을 상품명이나 키워드를 입력해 주세요.', state.search);
  if (query === null) return;
  state.filter = 'all'; state.search = query.trim();
  renderSummary(); renderPipeline(); renderJobs();
  document.querySelector('[data-section="content"]')?.scrollIntoView({behavior:'smooth', block:'start'});
  if (state.search) showToast(`“${state.search}” 검색 결과를 표시합니다.`);
});
document.querySelector('[data-top-action="notifications"]')?.addEventListener('click', () => {
  activateNav('content');
  setQueueFilter('needs');
  showToast('지금 확인이 필요한 작업만 모았습니다.');
});
load().then(() => navigate(currentRoute(), false)); loadHot().then(() => {
  if (currentRoute() === 'trends') renderPage('trends');
});
loadBlogPoc(false).then(() => {
  if (currentRoute() === 'blog') renderPage('blog');
});
setInterval(() => {
  if (localStorage.getItem('shopshorts:autoRefresh') !== 'off') {
    load(true); loadHot();
    if (currentRoute() === 'blog') loadBlogPoc();
  }
}, 12000);
</script>
</body>
</html>
